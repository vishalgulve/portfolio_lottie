<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lottie Hover + Click</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.6/lottie.min.js"></script>
  <style>
    body {
      margin: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #lottie-container {
      width: 300px;
      height: 300px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="lottie-container"></div>

  <script>
    var anim = lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: true,
      autoplay: false,
      path: "https://lottie.host/5edea683-fc41-4a43-b153-f2cb43eb2357/1hJkAZ9sWv.json"
    });

    // Play animation on hover
    document.getElementById("lottie-container").addEventListener("mouseenter", function() {
      anim.play();
    });

    // Stop animation when not hovering
    document.getElementById("lottie-container").addEventListener("mouseleave", function() {
      anim.stop();
    });

    // Open link on click
    document.getElementById("lottie-container").addEventListener("click", function() {
      window.open("https://vishalgulve.wixstudio.com/portfolio", "_blank"); // Change link here
    });
  </script>
</body>
</html>
